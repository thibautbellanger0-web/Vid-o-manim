# Rendu automatique des vidéos Manim sur les serveurs de GitHub.
# À créer via l'onglet Actions > "set up a workflow yourself" (ou à coller à la place de l'ancien).
# Chaque fois qu'un fichier .py est envoyé (ou remplacé), dans n'importe quel dossier du dépôt
# (ex. Premiere/2.2_Spectrophotometrie/), la vidéo est calculée et publiée en MP4 dans "Releases".
# Le nom de la vidéo reprend le chemin : Premiere_2_2_Spectrophotometrie_correction_exo1_eosine_Correction.mp4
# Version 3 : dossiers acceptés, noms avec espaces/parenthèses acceptés, erreur claire si aucune vidéo.

name: Rendu Manim
run-name: "🎬 ${{ github.event_name == 'workflow_dispatch' && format('Rendu manuel {0}', github.event.inputs.fichier) || github.event.head_commit.message }}"

on:
  push:
    paths:
      - "**.py"
  workflow_dispatch:
    inputs:
      qualite:
        description: "Qualité : l = 480p (rapide), m = 720p, h = 1080p"
        default: "m"
        required: true
      fichier:
        description: "Chemin du fichier .py à calculer, ex. Seconde/2.1_Especes/correction.py (vide = tous)"
        default: ""
        required: false

permissions:
  contents: write

jobs:
  rendu:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Récupérer les fichiers
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer Manim et LaTeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libcairo2-dev libpango1.0-dev pkg-config ffmpeg \
            texlive texlive-latex-extra texlive-lang-french cm-super dvisvgm
          pip install -q manim

      - name: Liste des fichiers à calculer
        run: |
          git -c core.quotepath=off diff --name-only HEAD~1 HEAD -- '*.py' > liste.txt 2>/dev/null || true
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${{ github.event.inputs.fichier }}" ]; then
              echo "${{ github.event.inputs.fichier }}" > liste.txt
            else
              git -c core.quotepath=off ls-files '*.py' > liste.txt
            fi
          fi
          [ -s liste.txt ] || git -c core.quotepath=off ls-files '*.py' > liste.txt
          echo "Fichiers à calculer :"
          cat liste.txt

      - name: Calculer les vidéos
        id: rendu
        run: |
          Q="${{ github.event.inputs.qualite }}"
          [ -z "$Q" ] && Q="m"
          mkdir -p sortie travail
          while IFS= read -r f; do
            [ -f "$f" ] || { echo "Fichier introuvable : $f"; continue; }
            nom="${f%.py}"
            sur=$(printf '%s' "$nom" | iconv -f utf-8 -t ascii//TRANSLIT 2>/dev/null | tr -c 'A-Za-z0-9_' '_')
            [ -n "$sur" ] || sur=video
            cp "$f" "travail/$sur.py"
            echo "=== Rendu de $f (nom de travail : $sur) ==="
            manim -q$Q --disable_caching -a "travail/$sur.py"
            find media/videos/"$sur" -name "*.mp4" -not -path "*partial_movie_files*" -print0 |
              while IFS= read -r -d '' v; do cp "$v" "sortie/${sur}_$(basename "$v")"; done
          done < liste.txt
          echo "Vidéos produites :"
          ls -la sortie
          if ! ls sortie/*.mp4 >/dev/null 2>&1; then
            echo "::error::Aucune vidéo produite. Vérifier le nom du fichier .py et les messages ci-dessus."
            exit 1
          fi
          # titre lisible pour la page Releases : « Seconde – 2.1 Identification des espèces – correction ex1a3 »
          TITRE=$(sed -e 's/\.py$//' -e 's#/# – #g' -e 's/_/ /g' -e 's/  */ /g' liste.txt | paste -sd ';' - | sed 's/;/ + /g')
          echo "titre=$TITRE" >> "$GITHUB_OUTPUT"
          echo "date=$(TZ=Europe/Paris date '+%d/%m/%Y %Hh%M')" >> "$GITHUB_OUTPUT"

      - name: Publier les MP4 (onglet Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rendu-${{ github.run_number }}
          name: "${{ steps.rendu.outputs.titre }}"
          body: "Vidéo calculée le ${{ steps.rendu.outputs.date }} (rendu n°${{ github.run_number }})."
          files: sortie/*.mp4
          fail_on_unmatched_files: true
